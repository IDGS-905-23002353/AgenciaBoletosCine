<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - CINE LAIT</title>
    <!-- PWA: manifest, color de la barra e icono -->
    <meta name="theme-color" content="#e50914">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <!-- Navbar simplificada para el login -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-secondary py-1 mb-5">
        <div class="container d-flex justify-content-center">
            <a class="navbar-brand text-danger fs-2 m-0" href="index.html">CINE<span class="text-white">LAIT</span></a>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-5">
                <!-- Contenedor principal estilo Card -->
                <div class="auth-container card p-4 p-md-5 rounded-4 shadow">
                    
                    <!-- Formulario de Login -->
                    <div id="login-section">
                        <div class="text-center mb-4">
                            <h3 class="fw-bold text-black mb-1">Iniciar Sesión</h3>
                            <p class="text-muted small">Ingresa tus credenciales para continuar</p>
                        </div>
                        
                        <form id="form-login">
                            <div class="mb-3">
                                <label for="login-username" class="form-label text-muted small fw-semibold mb-1">Usuario</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-secondary text-muted"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control" id="login-username" placeholder="Tu usuario" required>
                                </div>
                            </div>
                            
                            <div class="mb-4">
                                <label for="login-password" class="form-label text-muted small fw-semibold mb-1">Contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-secondary text-muted"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="login-password" placeholder="••••••••" required>
                                </div>
                            </div>
                            
                            <button type="submit" class="btn btn-danger w-100 py-2 rounded-pill fw-semibold shadow-sm">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
                            </button>
                        </form>
                        
                        <div class="text-center mt-4 pt-3 border-top border-secondary-subtle">
                            <p class="text-muted small mb-0">
                                ¿No tienes cuenta? 
                                <button type="button" id="btn-show-register" class="btn btn-link text-danger fw-bold text-decoration-none p-0 align-baseline ms-1">Regístrate</button>
                            </p>
                        </div>
                    </div>

                    <!-- Formulario de Registro (Oculto por defecto) -->
                    <div id="register-section" style="display: none;">
                        <div class="text-center mb-4">
                            <h3 class="fw-bold text-black mb-1">Registro de Usuario</h3>
                            <p class="text-muted small">Crea una cuenta para apartar tus boletos</p>
                        </div>

                        <form id="form-register">
                            <div class="mb-3">
                                <label for="reg-username" class="form-label text-muted small fw-semibold mb-1">Nuevo Usuario</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-secondary text-muted"><i class="bi bi-person-plus"></i></span>
                                    <input type="text" class="form-control" id="reg-username" placeholder="Elige un usuario" required>
                                </div>
                            </div>
                            
                            <div class="mb-4">
                                <label for="reg-password" class="form-label text-muted small fw-semibold mb-1">Contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-secondary text-muted"><i class="bi bi-shield-lock"></i></span>
                                    <input type="password" class="form-control" id="reg-password" placeholder="Crea una contraseña" required>
                                </div>
                            </div>
                            
                            <button type="submit" class="btn btn-danger w-100 py-2 rounded-pill fw-semibold shadow-sm">
                                <i class="bi bi-person-check me-2"></i>Crear Cuenta
                            </button>
                        </form>

                        <div class="text-center mt-4 pt-3 border-top border-secondary-subtle">
                            <p class="text-muted small mb-0">
                                ¿Ya tienes cuenta? 
                                <button type="button" id="btn-show-login" class="btn btn-link text-danger fw-bold text-decoration-none p-0 align-baseline ms-1">Inicia Sesión</button>
                            </p>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
